<!DOCTYPE html>
<html>

<head>
    <title>Password Generator</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="container">
        <div class="top-section">
            <h1 class="top-header">Generate a <span>random password</span></h1>
            <p class="top-text">Never use an insecure password again.</p>
        </div>
        <input id="input" placeholder="enter pass length: max 15" type="number">
        <button class="btn">Generate Password</button>
        <hr class="line" />
        <div class="password-container">
            <p id="pass1" class="password"></p>
            <p id="pass2" class="password"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
